# VerticalLLM Lab - CPU-friendly smoke configuration.
# Trims everything so the full pipeline finishes on a laptop in a few minutes.
seed: 42
device: cpu
hf_endpoint: ""

paths:
  root: .
  data: data
  checkpoints: checkpoints
  results: results

data:
  dataset_name: qiaojin/PubMedQA
  train_source: pqa_artificial
  eval_source: pqa_labeled
  max_train_samples: 1200
  max_eval_samples: 60
  corpus_size: 600
  seed: 42

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  dtype: float32
  attn_implementation: sdpa
  use_chat_template: true

retriever:
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 2
  batch_size: 32
  normalize: true
  max_doc_chars: 700

sft:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  train_with_context: false
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_length: 384
  logging_steps: 5
  save_total_limit: 1
  eval_fraction: 0.0
  max_steps: 40

eval:
  batch_size: 16
  max_new_tokens: 64
